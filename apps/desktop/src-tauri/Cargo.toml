[package]
name = "show-dont-prompt"
version = "0.0.1"
description = "Record what you see, send it to AI"
authors = ["Show Don't Prompt Contributors"]
license = "MIT"
repository = "https://github.com/Yolooo332/PromptCast"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
